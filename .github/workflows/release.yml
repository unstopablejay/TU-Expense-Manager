name: Release

# Tag a version to publish it:  git tag v1.1.0 && git push origin v1.1.0
# The tag name becomes the APK's version, so that is the only place a version
# number needs changing. Tags are frozen to one commit: a new release always
# needs a new tag, and re-releasing an old tag rebuilds the old code.
#
# Tag globs are case-sensitive, so both cases are listed — a `V1.0.0` tag would
# silently match nothing against a `v*` pattern alone.
on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # Gate the release on a healthy tree — a failing test blocks publishing.
      - run: flutter analyze
      - run: flutter test

      # Secrets are passed through `env` rather than interpolated into the script,
      # so their values never appear in a shell command line.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # The tag is the single source of truth for the version a release reports:
      # `v1.2.0` builds an APK that calls itself 1.2.0. Without this the APK takes
      # its version from pubspec.yaml, which then has to be remembered separately
      # and silently drifts — v1.0.0, v1.0.1 and v1.0.3 each shipped an APK that
      # still called itself 1.0.0 build 1, so no device could tell them apart.
      #
      # versionCode is the run number rather than anything parsed from the tag.
      # Android only cares that it increases, and run numbers always do, which
      # digits taken from a version would not: 1.9.0 -> 1.10.0 goes backwards.
      - name: Derive the version from the tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME#[vV]}"
            echo "args=--build-name=$NAME --build-number=$GITHUB_RUN_NUMBER" \
              >> "$GITHUB_OUTPUT"
            echo "Building $GITHUB_REF_NAME as versionName=$NAME " \
                 "versionCode=$GITHUB_RUN_NUMBER"
          else
            # A manual run has no tag to read, so pubspec.yaml's version stands.
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "No tag — taking the version from pubspec.yaml"
          fi

      - run: flutter build apk --release ${{ steps.version.outputs.args }}

      # Manual runs have no tag to release against, so keep the APK reachable.
      - name: Upload APK as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Idempotent: attaches to an existing release for this tag rather than
      # failing, so a re-run can repair a release that is missing its APK.
      - name: Publish release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  # The container image, published beside the APK so the two halves of a release
  # carry the same version. The web bundle is built inside the image rather than
  # here, so what ships is exactly what the Dockerfile produces.
  image:
    name: Publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to GHCR
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Lower-cased because a GHCR repository name must be, and a GitHub username
      # need not be — `unstopablejay` is fine but the rule bites anyone whose is
      # not, and a 403 from a case mismatch is an unhelpful way to find out.
      - name: Work out the image name and tags
        id: meta
        run: |
          REPO="ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/tu-expense-server"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#[vV]}"
            echo "tags=$REPO:$VERSION,$REPO:latest" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$REPO:dev" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      # linux/amd64 only. ZimaOS is x86_64, and adding arm64 would double a build
      # that already spends most of its time compiling a Flutter web bundle. Add
      # it here if the server ever needs to run on a Pi.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          # No cache-from/cache-to: type=gha here. The Actions cache backend has
          # broken across service versions more than once, it fails at the *start*
          # of a build rather than at the end, and a caching layer that can fail a
          # release is a bad trade for build minutes on a job that runs per tag.
          provenance: false # CasaOS's image inspection dislikes the attestation manifest
