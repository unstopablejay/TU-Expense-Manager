name: Release APK

# Tag a version to publish it:  git tag v1.0.0 && git push origin v1.0.0
# Tag globs are case-sensitive, so both cases are listed — a `V1.0.0` tag would
# silently match nothing against a `v*` pattern alone.
on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # Gate the release on a healthy tree — a failing test blocks publishing.
      - run: flutter analyze
      - run: flutter test

      # Secrets are passed through `env` rather than interpolated into the script,
      # so their values never appear in a shell command line.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter build apk --release

      # Manual runs have no tag to release against, so keep the APK reachable.
      - name: Upload APK as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Idempotent: attaches to an existing release for this tag rather than
      # failing, so a re-run can repair a release that is missing its APK.
      - name: Publish release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
